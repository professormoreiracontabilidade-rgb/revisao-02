<script>
const QUESTIONS=[{"n":26,"text":"A Cia Vida pagou R$ 8.000 por atendimento medico aos funcionarios. Do total, 25% sera descontado dos empregados. O impacto no resultado da empresa e:","alts":[{"letter":"A","text":"-R$ 2.000."},{"letter":"B","text":"-R$ 6.000."},{"letter":"C","text":"-R$ 8.000."},{"letter":"D","text":"-R$ 10.000."}],"answer":"B","comment":"<b>Comentário:<\/b> A empresa reconhece apenas a parcela que efetivamente suporta: 75% de 8.000 = 6.000."},{"n":27,"text":"Um restaurante comprou forno por R$ 50.000 e obteve desconto de 10% por pagamento imediato. A saida de caixa foi R$ 45.000. A contrapartida correta e:","alts":[{"letter":"A","text":"Ativo imobilizado de R$ 45.000."},{"letter":"B","text":"Ativo imobilizado de R$ 50.000 e receita financeira de R$ 5.000."},{"letter":"C","text":"Ativo imobilizado de R$ 50.000 e outras receitas de R$ 5.000."},{"letter":"D","text":"Ativo imobilizado de R$ 50.000 e retificadora de R$ 5.000."}],"answer":"A","comment":"<b>Comentário:<\/b> Desconto obtido na aquisicao reduz o custo de compra. O imobilizado entra pelo valor efetivamente pago/valor de aquisicao liquido: 45.000."},{"n":28,"text":"Um hotel adquiriu equipamento por R$ 80.000, com abatimento comercial de 5% por pagamento via Pix. O caixa diminuiu R$ 76.000. O lancamento reconhece:","alts":[{"letter":"A","text":"ativo imobilizado de R$ 76.000."},{"letter":"B","text":"ativo imobilizado de R$ 80.000 e receita de R$ 4.000."},{"letter":"C","text":"despesa de R$ 4.000."},{"letter":"D","text":"ativo imobilizado de R$ 80.000 e passivo de R$ 4.000."}],"answer":"A","comment":"<b>Comentário:<\/b> O abatimento reduz diretamente o custo do ativo. Nao se reconhece receita financeira por desconto comercial na compra."},{"n":29,"text":"Uma empresa possui: caixa R$ 80.000; estoques R$ 170.000; emprestimos CP R$ 120.000; financiamento LP R$ 300.000; imobilizado R$ 520.000; intangivel R$ 180.000; capital social R$ 350.000. O ativo nao circulante e:","alts":[{"letter":"A","text":"R$ 700.000."},{"letter":"B","text":"R$ 250.000."},{"letter":"C","text":"R$ 520.000."},{"letter":"D","text":"R$ 1.050.000."}],"answer":"A","comment":"<b>Comentário:<\/b> Ativo nao circulante inclui imobilizado e intangivel: 520.000 + 180.000 = 700.000. Caixa e estoques sao circulantes."},{"n":30,"text":"Em 31/12/X1, a entidade tinha caixa R$ 60.000, estoques R$ 90.000, contas a receber R$ 40.000, imobilizado R$ 310.000 e intangivel R$ 140.000. O ativo nao circulante soma:","alts":[{"letter":"A","text":"R$ 450.000."},{"letter":"B","text":"R$ 190.000."},{"letter":"C","text":"R$ 310.000."},{"letter":"D","text":"R$ 640.000."}],"answer":"A","comment":"<b>Comentário:<\/b> O ativo nao circulante considerado e formado por imobilizado e intangivel: 310.000 + 140.000 = 450.000."},{"n":31,"text":"Materiais foram comprados em marco, pagos em junho e utilizados na prestacao de servicos em abril. Pelo regime de competencia, a despesa deve ser reconhecida em:","alts":[{"letter":"A","text":"marco."},{"letter":"B","text":"abril."},{"letter":"C","text":"junho."},{"letter":"D","text":"dezembro."}],"answer":"B","comment":"<b>Comentário:<\/b> A despesa e reconhecida quando os materiais sao consumidos/utilizados para gerar receita, ou seja, em abril."},{"n":32,"text":"A empresa comprou insumos em janeiro, pagou em fevereiro e consumiu os insumos na prestacao de servicos em maio. A despesa deve ser reconhecida em:","alts":[{"letter":"A","text":"janeiro."},{"letter":"B","text":"fevereiro."},{"letter":"C","text":"maio."},{"letter":"D","text":"quando houver pagamento ao fornecedor."}],"answer":"C","comment":"<b>Comentário:<\/b> Pela competencia, o reconhecimento da despesa ocorre no periodo do consumo dos insumos, nao na compra nem no pagamento."},{"n":33,"text":"Relacione: 1. Emprestimos a pagar em 18 meses. 2. Clientes a receber em 4 meses. 3. Fornecedores a pagar em 2 meses. 4. Veiculos para uso por 5 anos. Na ordem Ativo Circulante, Ativo Nao Circulante, Passivo Circulante, Passivo Nao Circulante:","alts":[{"letter":"A","text":"2 - 4 - 3 - 1."},{"letter":"B","text":"4 - 2 - 1 - 3."},{"letter":"C","text":"3 - 1 - 2 - 4."},{"letter":"D","text":"1 - 3 - 4 - 2."}],"answer":"A","comment":"<b>Comentário:<\/b> Recebiveis em 4 meses sao AC; veiculos de uso sao ANC; fornecedores em 2 meses sao PC; emprestimos em 18 meses sao PNC."},{"n":34,"text":"Associe: 1. Duplicatas a receber em 8 meses. 2. Maquinas para uso por 7 anos. 3. Salarios a pagar no mes seguinte. 4. Financiamento a pagar em 36 meses. Na ordem AC, ANC, PC e PNC:","alts":[{"letter":"A","text":"1 - 2 - 3 - 4."},{"letter":"B","text":"2 - 1 - 4 - 3."},{"letter":"C","text":"3 - 4 - 1 - 2."},{"letter":"D","text":"4 - 3 - 2 - 1."}],"answer":"A","comment":"<b>Comentário:<\/b> Direitos realizaveis em ate 12 meses sao AC; maquinas de uso sao ANC; obrigacoes de curto prazo sao PC; financiamento de longo prazo e PNC."},{"n":35,"text":"Assinale a alternativa que apresenta apenas componentes do Patrimonio Liquido:","alts":[{"letter":"A","text":"Capital Social - Reservas de Lucros - Acoes em Tesouraria."},{"letter":"B","text":"Capital Social - Fornecedores - Reservas de Capital."},{"letter":"C","text":"Debentures - Ajustes de Avaliacao Patrimonial - Capital Social."},{"letter":"D","text":"Investimentos - Capital Social - Reservas de Lucros."}],"answer":"A","comment":"<b>Comentário:<\/b> Capital social, reservas de lucros e acoes em tesouraria integram o PL. Fornecedores e debentures sao passivos; investimentos sao ativos."},{"n":36,"text":"Conforme a Lei das S.A., compoem o Patrimonio Liquido:","alts":[{"letter":"A","text":"Reservas de Capital - Ajustes de Avaliacao Patrimonial - Prejuizos Acumulados."},{"letter":"B","text":"Caixa - Reservas de Lucros - Capital Social."},{"letter":"C","text":"Dividendos a Pagar - Capital Social - Acoes em Tesouraria."},{"letter":"D","text":"Emprestimos - Reservas de Capital - Ajustes de Avaliacao Patrimonial."}],"answer":"A","comment":"<b>Comentário:<\/b> Reservas de capital, ajustes de avaliacao patrimonial e prejuizos acumulados sao contas do PL. Caixa e ativo; dividendos a pagar e emprestimos sao passivos."},{"n":37,"text":"A investidora possui: Omega controlada 80%, PL R$ 900.000; Gama controlada 75%, PL R$ 600.000; Beta coligada 30%, PL R$ 500.000; Delta sem influencia 10%, PL R$ 400.000. A participacao de nao controladores no consolidado e:","alts":[{"letter":"A","text":"R$ 330.000."},{"letter":"B","text":"R$ 480.000."},{"letter":"C","text":"R$ 150.000."},{"letter":"D","text":"R$ 1.100.000."}],"answer":"A","comment":"<b>Comentário:<\/b> Nao controladores existem apenas nas controladas consolidadas. Omega: 20% x 900.000 = 180.000. Gama: 25% x 600.000 = 150.000. Total = 330.000."},{"n":38,"text":"A Cia Mae controla Alfa com 85% de participacao e PL de R$ 1.200.000, e Beta com 60% e PL de R$ 800.000. Tambem possui coligada Gama 25%, PL R$ 700.000. A participacao de nao controladores e:","alts":[{"letter":"A","text":"R$ 500.000."},{"letter":"B","text":"R$ 675.000."},{"letter":"C","text":"R$ 320.000."},{"letter":"D","text":"R$ 180.000."}],"answer":"A","comment":"<b>Comentário:<\/b> Calcula-se apenas sobre controladas: Alfa 15% x 1.200.000 = 180.000; Beta 40% x 800.000 = 320.000; total = 500.000. Coligada nao entra como nao controladores no consolidado."},{"n":39,"text":"Uma empresa adquiriu maquina com: preco R$ 400.000; imposto nao recuperavel R$ 40.000; preparacao do local R$ 70.000; materiais consumidos em testes R$ 30.000; honorarios dos tecnicos dos testes R$ 20.000; valor residual R$ 80.000. O custo inicial do imobilizado e:","alts":[{"letter":"A","text":"R$ 400.000."},{"letter":"B","text":"R$ 440.000."},{"letter":"C","text":"R$ 510.000."},{"letter":"D","text":"R$ 560.000."}],"answer":"D","comment":"<b>Comentário:<\/b> Custo inicial inclui preco, tributos nao recuperaveis e custos diretamente atribuiveis para colocar o ativo em condicao de uso: 400.000 + 40.000 + 70.000 + 30.000 + 20.000 = 560.000. Valor residual nao reduz o custo inicial; afeta depreciacao."},{"n":40,"text":"A Cia Industria instalou equipamento com: preco R$ 300.000; imposto de importacao nao recuperavel R$ 30.000; frete e seguro R$ 25.000; instalacao R$ 15.000; testes R$ 10.000; vida util 8 anos; residual R$ 50.000. O custo de registro inicial e:","alts":[{"letter":"A","text":"R$ 330.000."},{"letter":"B","text":"R$ 355.000."},{"letter":"C","text":"R$ 380.000."},{"letter":"D","text":"R$ 430.000."}],"answer":"C","comment":"<b>Comentário:<\/b> Somam-se todos os custos necessarios para colocar o ativo em funcionamento: 300.000 + 30.000 + 25.000 + 15.000 + 10.000 = 380.000. Vida util e residual sao usados na depreciacao."},{"n":41,"text":"Uma maquina foi adquirida em 01/01/2021 por R$ 300.000, vida util inicial de 10 anos e sem residual, depreciacao linear. Em 31/12/2025, a vida util total foi reestimada para 12 anos e o residual passou a R$ 60.000. A depreciacao anual a partir de 2026 e:","alts":[{"letter":"A","text":"R$ 15.000."},{"letter":"B","text":"R$ 12.857."},{"letter":"C","text":"R$ 30.000."},{"letter":"D","text":"R$ 60.000."}],"answer":"B","comment":"<b>Comentário:<\/b> Depreciacao acumulada em 5 anos: 300.000/10 x 5 = 150.000. Valor contabil em 31/12/2025 = 150.000. Vida remanescente: 12 - 5 = 7 anos. Base depreciavel nova: 150.000 - 60.000 = 90.000. Depreciacao anual = 90.000/7 = 12.857,14."},{"n":42,"text":"Um equipamento foi comprado em 01/01/2020 por R$ 500.000, vida util inicial de 10 anos, sem residual, metodo linear. Em 31/12/2024, a vida util total foi reestimada para 8 anos e o valor residual para R$ 80.000. A depreciacao anual futura sera:","alts":[{"letter":"A","text":"R$ 56.667."},{"letter":"B","text":"R$ 50.000."},{"letter":"C","text":"R$ 90.000."},{"letter":"D","text":"R$ 80.000."}],"answer":"A","comment":"<b>Comentário:<\/b> Ate 31/12/2024 passaram 5 anos: depreciacao acumulada = 500.000/10 x 5 = 250.000. Valor contabil = 250.000. Vida remanescente = 8 - 5 = 3 anos. Nova base = 250.000 - 80.000 = 170.000. Depreciacao anual = 170.000/3 = 56.666,67."},{"n":43,"text":"Segundo a Estrutura Conceitual, quais são as características qualitativas fundamentais da informação contábil-financeira útil?","alts":[{"letter":"A","text":"relevância e representação fidedigna."},{"letter":"B","text":"comparabilidade e tempestividade."},{"letter":"C","text":"prudência e conservadorismo."},{"letter":"D","text":"verificabilidade e compreensibilidade."}],"answer":"A","comment":"<b>Comentário:<\/b> As características fundamentais são relevância e representação fidedigna. As demais são características de melhoria ou termos que não substituem as fundamentais."},{"n":44,"text":"A representação fidedigna, conforme a Estrutura Conceitual, não significa exatidão absoluta em todos os aspectos. Ela exige que a informação seja:","alts":[{"letter":"A","text":"completa, neutra e livre de erro."},{"letter":"B","text":"material, comparável e tempestiva."},{"letter":"C","text":"prudente, conservadora e verificável."},{"letter":"D","text":"uniforme, simples e sintética."}],"answer":"A","comment":"<b>Comentário:<\/b> A representação fidedigna exige completude, neutralidade e ausência de erro. Livre de erro não é sinônimo de perfeição absoluta, mas de ausência de erros relevantes no processo."},{"n":45,"text":"A informação é considerada material quando sua omissão, distorção ou obscuridade pode influenciar decisões tomadas pelos usuários principais. Esse conceito se relaciona diretamente com:","alts":[{"letter":"A","text":"relevância."},{"letter":"B","text":"comparabilidade."},{"letter":"C","text":"verificabilidade."},{"letter":"D","text":"tempestividade."}],"answer":"A","comment":"<b>Comentário:<\/b> Materialidade é aspecto específico da relevância. Uma informação material é capaz de influenciar decisões dos usuários."},{"n":46,"text":"O pressuposto da continuidade indica que a entidade:","alts":[{"letter":"A","text":"continuará em operação no futuro previsível, salvo evidência de liquidação ou encerramento."},{"letter":"B","text":"deve reconhecer receitas apenas quando receber caixa."},{"letter":"C","text":"deve compensar ativos e passivos sempre que possível."},{"letter":"D","text":"deve apresentar apenas informações sem estimativas."}],"answer":"A","comment":"<b>Comentário:<\/b> A continuidade presume a manutenção das operações no futuro previsível. Não se confunde com regime de caixa, compensação ou ausência de estimativas."},{"n":47,"text":"Na NBC TG 26, a compensação entre ativos e passivos ou receitas e despesas:","alts":[{"letter":"A","text":"não deve ser feita, exceto quando exigida ou permitida por norma."},{"letter":"B","text":"é obrigatória sempre que reduzir o tamanho das demonstrações."},{"letter":"C","text":"é livre, desde que facilite a leitura."},{"letter":"D","text":"é vedada apenas para entidades de capital aberto."}],"answer":"A","comment":"<b>Comentário:<\/b> A regra geral é não compensar. A compensação só ocorre quando uma norma permitir ou exigir."},{"n":48,"text":"Uma empresa comercial apresentou na DVA: receita de contratos com clientes de R$ 180.000,00; CMV de R$ 70.000,00; perdas estimadas com créditos de liquidação duvidosa de R$ 5.000,00; perdas por desvalorização de ativos de R$ 8.000,00; depreciação de R$ 12.000,00, O valor adicionado líquido produzido é:","alts":[{"letter":"A","text":"R$ 85.000,00,"},{"letter":"B","text":"R$ 97.000,00,"},{"letter":"C","text":"R$ 110.000,00,"},{"letter":"D","text":"R$ 168.000,00,"}],"answer":"A","comment":"<b>Comentário:<\/b> Cálculo da DVA: receita menos insumos/retencões (70.000,00 + 5.000,00 + 8.000,00) = R$ 97.000,00, Depois subtrai a depreciação de R$ 12.000,00. chegando a R$ 85.000,00,"},{"n":49,"text":"Uma empresa comercial apresentou na DVA: receita de contratos com clientes de R$ 420.000,00; CMV de R$ 160.000,00; perdas estimadas com créditos de liquidação duvidosa de R$ 14.000,00; perdas por desvalorização de ativos de R$ 26.000,00; depreciação de R$ 30.000,00, O valor adicionado líquido produzido é:","alts":[{"letter":"A","text":"R$ 190.000,00,"},{"letter":"B","text":"R$ 220.000,00,"},{"letter":"C","text":"R$ 260.000,00,"},{"letter":"D","text":"R$ 390.000,00,"}],"answer":"A","comment":"<b>Comentário:<\/b> Cálculo da DVA: receita menos insumos/retencões (160.000,00 + 14.000,00 + 26.000,00) = R$ 220.000,00, Depois subtrai a depreciação de R$ 30.000,00. chegando a R$ 190.000,00,"},{"n":50,"text":"Uma empresa comercial apresentou na DVA: receita de contratos com clientes de R$ 150.000,00; CMV de R$ 60.000,00; perdas estimadas com créditos de liquidação duvidosa de R$ 4.000,00; perdas por desvalorização de ativos de R$ 6.000,00; depreciação de R$ 10.000,00, O valor adicionado líquido produzido é:","alts":[{"letter":"A","text":"R$ 70.000,00,"},{"letter":"B","text":"R$ 80.000,00,"},{"letter":"C","text":"R$ 90.000,00,"},{"letter":"D","text":"R$ 140.000,00,"}],"answer":"A","comment":"<b>Comentário:<\/b> Cálculo da DVA: receita menos insumos/retencões (60.000,00 + 4.000,00 + 6.000,00) = R$ 80.000,00, Depois subtrai a depreciação de R$ 10.000,00. chegando a R$ 70.000,00,"}];
const QUIZ=2, KEY='moreira_aluno_v1_quiz_'+QUIZ+'_';
const $=id=>document.getElementById(id);
const read=(k,def)=>{try{const s=localStorage.getItem(KEY+k);return s===null?def:JSON.parse(s)}catch(e){return def}};
const write=(k,v)=>{try{localStorage.setItem(KEY+k,JSON.stringify(v))}catch(e){}};
let idx=Math.min(QUESTIONS.length-1,Math.max(0,read('idx',0))),answers=read('answers',{}),checked=read('checked',{}),name=read('name',''),shownCheckpoint=read('checkpoint',0);
function save(){write('idx',idx);write('answers',answers);write('checked',checked);write('checkpoint',shownCheckpoint);}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function beep(good){try{const C=window.AudioContext||window.webkitAudioContext;const ctx=new C();const t=ctx.currentTime;[0,.11].forEach((d,j)=>{const o=ctx.createOscillator(),gain=ctx.createGain();o.type='sine';o.frequency.value=good?(j?830:660):(j?220:330);gain.gain.setValueAtTime(.08,t+d);gain.gain.exponentialRampToValueAtTime(.001,t+d+.17);o.connect(gain);gain.connect(ctx.destination);o.start(t+d);o.stop(t+d+.18)});setTimeout(()=>ctx.close(),550)}catch(e){}}
function stats(){let correct=0,wrong=0,answered=0,confirmed=0;QUESTIONS.forEach(q=>{if(answers[q.n])answered++;if(checked[q.n]&&answers[q.n]){confirmed++;if(answers[q.n]===q.answer)correct++;else wrong++}});return {correct,wrong,answered,confirmed,pct:(correct/QUESTIONS.length*100).toFixed(1).replace('.',',')}}
function render(){const q=QUESTIONS[idx],done=!!checked[q.n],selected=answers[q.n]||'',st=stats();$('position').textContent=`Questão ${idx+1}/${QUESTIONS.length} · Nº ${q.n}`;$('qbadge').textContent=`QUESTÃO ${q.n}`;$('range').textContent=`${QUESTIONS.length} questões`;$('statement').textContent=q.text;$('bar').style.width=(st.confirmed/QUESTIONS.length*100)+'%';$('counter').textContent=`Acertos: ${st.correct} · Erros: ${st.wrong}`;
$('choices').innerHTML=q.alts.map(a=>{const cls=done?(a.letter===q.answer?'correct':a.letter===selected?'wrong':''):(a.letter===selected?'selected':'');return `<button class="answer ${cls}" data-a="${esc(a.letter)}" ${done?'disabled':''}><span class="letter">${esc(a.letter)}</span><span>${esc(a.text)}</span></button>`}).join('');
$('choices').querySelectorAll('[data-a]').forEach(btn=>btn.onclick=()=>{if(checked[q.n])return;answers[q.n]=btn.dataset.a;save();render()});
$('feedbackArea').innerHTML=done?`<div class="feedback"><div class="${selected===q.answer?'resultgood':'resultbad'}">${selected===q.answer?'✓ Resposta correta!':'✕ Resposta incorreta.'} Gabarito: ${esc(q.answer)}</div><div style="margin-top:12px">${q.comment}</div></div>`:'';
$('checkbtn').textContent=done?'✓ Resposta conferida':'Conferir resposta';$('checkbtn').disabled=done||!selected;$('checkbtn').style.opacity=(done||!selected)?'.65':'1';$('prev').disabled=idx===0;$('next').textContent=idx===QUESTIONS.length-1?'Ver resultado ▶':'Avançar ▶';
$('grid').innerHTML=QUESTIONS.map((x,j)=>`<button class="${checked[x.n]?'done':''} ${j===idx?'current':''}" data-j="${j}" aria-label="Questão ${x.n}">${x.n}</button>`).join('');$('grid').querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>jump(Number(b.dataset.j)));
if(st.confirmed>=10&&st.confirmed%10===0&&st.confirmed>shownCheckpoint){shownCheckpoint=st.confirmed;save();$('checkpoint').classList.remove('hidden');$('checkpoint').innerHTML=`<div class="checktext">📊 Parcial de ${st.confirmed} questões conferidas</div>Acertos: ${st.correct} · Erros: ${st.wrong} · Aproveitamento parcial: ${(st.correct/st.confirmed*100).toFixed(1).replace('.',',')}%`;}else{$('checkpoint').classList.add('hidden')}
}
function check(){const q=QUESTIONS[idx];if(!answers[q.n]||checked[q.n])return;checked[q.n]=true;save();beep(answers[q.n]===q.answer);render()}
function jump(j){idx=Math.max(0,Math.min(QUESTIONS.length-1,j));save();$('final').classList.add('hidden');render();window.scrollTo({top:0,behavior:'instant'})}
function advance(){if(idx===QUESTIONS.length-1){showFinal();return}jump(idx+1)}
function showFinal(){const st=stats(),box=$('final');box.classList.remove('hidden');box.innerHTML=`<h2>RESULTADO — QUIZ ${QUIZ}</h2><div class="summary"><b>Questões:</b> ${QUESTIONS.length}<br><b>Conferidas:</b> ${st.confirmed}<br><b>Acertos:</b> <span class="resultgood">${st.correct}</span><br><b>Erros:</b> <span class="resultbad">${st.wrong}</span><br><b>Aproveitamento geral:</b> ${st.pct}%</div><p class="muted">Questões ainda não conferidas são consideradas sem acerto no percentual geral.</p><label for="studentName"><b>Nome do aluno (opcional):</b></label><div><input class="name" id="studentName" maxlength="90" placeholder="Digite seu nome" value="${esc(name)}"></div><div class="actions"><button class="primary" id="share">Enviar resultado pelo WhatsApp</button><button class="secondary" id="back">Voltar às questões</button></div>`;box.querySelector('#studentName').oninput=e=>{name=e.target.value;write('name',name)};box.querySelector('#back').onclick=()=>{box.classList.add('hidden');window.scrollTo({top:0,behavior:'instant'})};box.querySelector('#share').onclick=()=>{const s=stats(),message=`Curso de Contabilidade Professor Moreira%0AQuiz ${QUIZ} — Modo Aluno%0AAluno: ${encodeURIComponent(name||'Não informado')}%0AConferidas: ${s.confirmed}/${QUESTIONS.length}%0AAcertos: ${s.correct}%0AErros: ${s.wrong}%0AAproveitamento: ${s.pct}%25`;window.open('https://wa.me/5561985323574?text='+message,'_blank','noopener,noreferrer')};box.scrollIntoView({behavior:'smooth',block:'start'})}
$('checkbtn').onclick=check;$('prev').onclick=()=>jump(idx-1);$('next').onclick=advance;$('finish').onclick=showFinal;
$('restart').onclick=()=>{if(!confirm('Deseja reiniciar todas as respostas deste quiz?'))return;idx=0;answers={};checked={};shownCheckpoint=0;save();$('final').classList.add('hidden');render();window.scrollTo(0,0)};render();
</script></body></html>
